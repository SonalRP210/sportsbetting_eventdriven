apiVersion: apps/v1
kind: Deployment
metadata:
  name: odds-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odds-service
  template:
    metadata:
      labels:
        app: odds-service
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: odds-service
      containers:
        - name: odds-service
          image: odds-service:latest
          env:
            # Flyway migrate + Hibernate validate; tune DB/Kafka via ConfigMap/Secret (e.g. SPRING_DATASOURCE_URL).
            - name: SPRING_PROFILES_ACTIVE
              value: production
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
