# Activate with SPRING_PROFILES_ACTIVE=production (or equivalent).
# Flyway owns the schema; Hibernate only validates against entities.
spring.flyway.enabled=true
spring.flyway.schemas=odds
spring.flyway.default-schema=odds
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate

app.features.seed-odds-enabled=false

# JWT resource server (default): set JWT_ISSUER_URI to your IdP issuer (must be non-empty).
# Alternative: APP_SECURITY_AUTH_TYPE=api-key plus APP_SECURITY_API_KEY from a Secret.
app.security.enabled=true
app.security.auth-type=${APP_SECURITY_AUTH_TYPE:jwt}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:}
app.security.api-key=${APP_SECURITY_API_KEY:}

management.tracing.sampling.probability=${TRACE_SAMPLE_PROBABILITY:0.05}

# Actuator / errors — avoid leaking internals on probes or client-facing failures.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Optional JWT audience validation (comma-separated if your IdP sets "aud").
# spring.security.oauth2.resourceserver.jwt.audiences=my-odds-api

# Forensics / replay: align with compliance before lowering retention.
app.outbox.retention-hours=${APP_OUTBOX_RETENTION_HOURS:168}
