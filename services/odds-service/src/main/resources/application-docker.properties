# Docker compose profile: Keycloak-issued JWT + RBAC (see infra/keycloak).
app.security.enabled=true
app.security.auth-type=jwt
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://keycloak:8080/realms/sportsbetting}

# Optional: restrict tokens to a client audience if you add an audience mapper in Keycloak.
# spring.security.oauth2.resourceserver.jwt.audiences=odds-gateway

# Same as production: no auto-seed in stack images.
app.features.seed-odds-enabled=false
