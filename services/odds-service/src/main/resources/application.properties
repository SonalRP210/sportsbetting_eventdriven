spring.application.name=odds-service
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sportsbetting}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sportsbetting}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sportsbetting}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=odds
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=false

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:30000}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.producer.acks=all
spring.kafka.producer.client-id=${spring.application.name}
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=2147483647
spring.kafka.producer.batch-size=32768
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.compression-type=lz4

management.tracing.sampling.probability=${TRACE_SAMPLE_PROBABILITY:1.0}
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# Debezium CDC is the primary outbox relay. Polling fallback is disabled by default.
# Set app.outbox.poll.enabled=true only if Debezium is unavailable (emergency recovery).
app.outbox.poll.enabled=${APP_OUTBOX_POLL_ENABLED:false}
app.outbox.poll-interval-ms=${APP_OUTBOX_POLL_INTERVAL_MS:1000}
app.outbox.dispatch.chunk-size=${APP_OUTBOX_DISPATCH_CHUNK_SIZE:25}

# Outbox row cleanup — Debezium never deletes rows; this job does.
# Rows older than retention-hours are safe to delete (Debezium reads from WAL at insert time).
# Dev default is short; production often uses longer retention or archives before delete (see application-production.properties).
app.outbox.retention-hours=${APP_OUTBOX_RETENTION_HOURS:2}

# Ingest batching: one DB transaction per chunk to cap lock hold time on large feeds.
app.odds.feed.chunk-size=${APP_ODDS_FEED_CHUNK_SIZE:50}
app.outbox.cleanup.cron=${APP_OUTBOX_CLEANUP_CRON:0 */15 * * * *}

app.kafka.schema-validation.enabled=${APP_KAFKA_SCHEMA_VALIDATION_ENABLED:true}

# HashiCorp Vault (Spring Cloud Vault). Only used when the Maven profile "vault" is enabled (-Pvault)
# and Spring profile "vault" is active — see application-vault.properties.
spring.cloud.vault.enabled=false

# HTTP API security (Spring Security). Disabled by default for local dev; production profile enables it.
app.security.enabled=${APP_SECURITY_ENABLED:false}
app.security.auth-type=${APP_SECURITY_AUTH_TYPE:jwt}
app.security.api-key-header=${APP_SECURITY_API_KEY_HEADER:X-API-Key}
app.security.api-key=${APP_SECURITY_API_KEY:}

# Dev convenience; disabled in production profile (see SeedOddsController).
app.features.seed-odds-enabled=${APP_FEATURES_SEED_ODDS_ENABLED:true}
