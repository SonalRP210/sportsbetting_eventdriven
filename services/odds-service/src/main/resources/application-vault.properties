# Profile "vault": load secrets from HashiCorp Vault KV into the Spring Environment (use with production).
# Example: SPRING_PROFILES_ACTIVE=production,vault
#
# Paths (KV v2): typically secret/data/{application}/{profile} e.g. secret/data/odds-service/production
# Store keys as Spring binds them: SPRING_DATASOURCE_PASSWORD, APP_SECURITY_API_KEY, JWT_ISSUER_URI, etc.

spring.cloud.vault.enabled=true
spring.cloud.vault.fail-fast=true
spring.cloud.vault.uri=${VAULT_ADDR:http://127.0.0.1:8200}
spring.cloud.vault.authentication=${VAULT_AUTHENTICATION:KUBERNETES}
spring.cloud.vault.kubernetes.role=${VAULT_K8S_ROLE:odds-service}
spring.cloud.vault.kubernetes.service-account-token-file=${VAULT_K8S_TOKEN_FILE:/var/run/secrets/kubernetes.io/serviceaccount/token}

spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=${VAULT_KV_BACKEND:secret}
spring.cloud.vault.kv.application-name=${spring.application.name}
