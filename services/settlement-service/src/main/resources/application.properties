spring.application.name=settlement-service
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sportsbetting}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sportsbetting}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sportsbetting}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

spring.kafka.listener.ack-mode=record

app.kafka.consumer.max-attempts=${APP_KAFKA_CONSUMER_MAX_ATTEMPTS:3}
app.kafka.consumer.backoff-ms=${APP_KAFKA_CONSUMER_BACKOFF_MS:1000}
app.kafka.dlq.suffix=${APP_KAFKA_DLT_SUFFIX:.dlq}

management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

app.kafka.schema-validation.enabled=${APP_KAFKA_SCHEMA_VALIDATION_ENABLED:false}
