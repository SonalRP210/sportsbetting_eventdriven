spring.application.name=api-gateway
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sportsbetting}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sportsbetting}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sportsbetting}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info,metrics,prometheus

gateway.routes.betting=${GATEWAY_ROUTE_BETTING:http://betting-service:8084}
gateway.routes.risk=${GATEWAY_ROUTE_RISK:http://risk-service:8080}
gateway.routes.wallet=${GATEWAY_ROUTE_WALLET:http://wallet-service:8080}
gateway.routes.user=${GATEWAY_ROUTE_USER:http://user-service:8080}
gateway.routes.ingestion=${GATEWAY_ROUTE_INGESTION:http://event-ingestion-service:8080}
gateway.routes.settlement=${GATEWAY_ROUTE_SETTLEMENT:http://settlement-service:8080}
gateway.routes.odds=${GATEWAY_ROUTE_ODDS:http://odds-service:8080}

# Optional: PEM/JKS SSL bundle for HTTPS or mTLS to backends (files often injected by Vault Agent).
