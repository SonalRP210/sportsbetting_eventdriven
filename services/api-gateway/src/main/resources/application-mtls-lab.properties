# Enables the gateway as an mTLS client for the local lab. The mTLS starter is
# supplied by the sibling mtls-secret-rotation repo when images use Dockerfile.mtls.
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus

gateway.downstream.ssl.bundle-name=${GATEWAY_DOWNSTREAM_SSL_BUNDLE_NAME:gateway-downstream}
spring.ssl.bundle.pem.gateway-downstream.truststore.certificate=${GATEWAY_DOWNSTREAM_TRUSTSTORE_CERTIFICATE:file:/vault/secrets/ca-chain.pem}
spring.ssl.bundle.pem.gateway-downstream.keystore.certificate=${GATEWAY_DOWNSTREAM_KEYSTORE_CERTIFICATE:file:/vault/secrets/client.crt}
spring.ssl.bundle.pem.gateway-downstream.keystore.private-key=${GATEWAY_DOWNSTREAM_KEYSTORE_PRIVATE_KEY:file:/vault/secrets/client.key}
