# Profile mtls-lab: Vault client cert + HTTPS routes to odds/betting mTLS ports.
mtls.enabled=true
mtls.provider=vault
mtls.secret-path=sportsbetting/lab/mtls/gateway
mtls.reload-on-startup=true
mtls.fail-on-startup-error=false
mtls.server.enabled=false
mtls.validate-certificate-chain=${MTLS_VALIDATE_CHAIN:false}
mtls.vault.address=${VAULT_ADDR:http://127.0.0.1:8200}
mtls.vault.auth=token
mtls.vault.token=${VAULT_TOKEN:dev-root-token}
mtls.vault.kv-mount=secret

gateway.downstream.mtls.enabled=true

# Plain HTTP app ports stay for health/Prometheus; gateway proxies over mTLS HTTPS.
gateway.routes.betting=${GATEWAY_ROUTE_BETTING:https://betting-service:8443}
gateway.routes.odds=${GATEWAY_ROUTE_ODDS:https://odds-service:8443}
