# Local mTLS lab profile. The mTLS server connector and /mtls/* endpoints are
# provided by mtls-spring-boot-starter from the sibling mtls-secret-rotation repo.
management.server.port=8085
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus

mtls.server.port=${MTLS_SERVER_PORT:8443}
mtls.vault.secret-path=${MTLS_VAULT_SECRET_PATH:secret/sportsbetting/lab/mtls/betting}
mtls.vault.addr=${VAULT_ADDR:http://vault:8200}
mtls.vault.token=${VAULT_TOKEN:dev-root-token}
