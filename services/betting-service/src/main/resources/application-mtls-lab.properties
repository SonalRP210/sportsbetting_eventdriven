# Profile mtls-lab: Vault KV mTLS material + Tomcat HTTPS (chaos / lab testing).
# Activate: SPRING_PROFILES_ACTIVE=docker,mtls-lab  (see devops-platform docker-compose.mtls-lab.yml)

management.server.port=8085
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

mtls.enabled=true
mtls.provider=vault
mtls.secret-path=sportsbetting/lab/mtls/betting
mtls.expiry-warning-days=30
mtls.reload-interval-minutes=0
mtls.reload-on-startup=true
mtls.fail-on-startup-error=false
# Set true to test scenario 03 (wrong CA). Lab certs are self-signed; use false for scenarios 01–02 unless PKI is updated.
mtls.validate-certificate-chain=${MTLS_VALIDATE_CHAIN:false}
mtls.server.enabled=true
mtls.server.port=8443
mtls.server.client-auth=true
mtls.vault.address=${VAULT_ADDR:http://127.0.0.1:8200}
mtls.vault.auth=token
mtls.vault.token=${VAULT_TOKEN:dev-root-token}
mtls.vault.kv-mount=secret
