spring.application.name=betting-service
server.port=8084

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sportsbetting}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sportsbetting}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sportsbetting}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=betting

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

spring.kafka.producer.acks=all
spring.kafka.producer.client-id=${spring.application.name}
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=2147483647
spring.kafka.producer.batch-size=32768
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.compression-type=lz4

spring.kafka.listener.ack-mode=record

app.kafka.consumer.max-attempts=${APP_KAFKA_CONSUMER_MAX_ATTEMPTS:3}
app.kafka.consumer.backoff-ms=${APP_KAFKA_CONSUMER_BACKOFF_MS:1000}
app.kafka.dlq.suffix=${APP_KAFKA_DLT_SUFFIX:.dlq}

management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

app.kafka.schema-validation.enabled=${APP_KAFKA_SCHEMA_VALIDATION_ENABLED:false}

# Debezium CDC is the primary outbox relay (see infra/local/debezium/betting-outbox-connector.json).
# Set app.outbox.poll.enabled=true only if Debezium is unavailable (emergency recovery).
app.outbox.poll.enabled=${APP_OUTBOX_POLL_ENABLED:false}
app.outbox.poll-interval-ms=${APP_OUTBOX_POLL_INTERVAL_MS:1000}
app.outbox.dispatch.chunk-size=${APP_OUTBOX_DISPATCH_CHUNK_SIZE:25}

# Outbox row cleanup when CDC relays inserts (rows may never be marked published=true).
app.outbox.retention-hours=${APP_OUTBOX_RETENTION_HOURS:2}
app.outbox.cleanup.cron=${APP_OUTBOX_CLEANUP_CRON:0 */15 * * * *}

app.kafka.topic.eventSettled=${APP_KAFKA_TOPIC_EVENT_SETTLED:settlement.event.settled.v1}
