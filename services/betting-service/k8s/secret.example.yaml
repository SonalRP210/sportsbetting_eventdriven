# Example Kubernetes Secret for betting-service (copy to cluster, replace values; do not commit real credentials).
# Required keys when using JWT auth (default): JWT_ISSUER_URI, SPRING_DATASOURCE_*, SPRING_KAFKA_BOOTSTRAP_SERVERS
# Optional: APP_SECURITY_AUTH_TYPE + APP_SECURITY_API_KEY for machine-to-machine auth instead of JWT.
# Optional: APP_SECURITY_ENABLED=false to disable HTTP security in an emergency (default in production profile is enabled in application-production.properties).
apiVersion: v1
kind: Secret
metadata:
  name: betting-service-secrets
  labels:
    app: betting-service
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/sportsbetting"
  SPRING_DATASOURCE_USERNAME: "sportsbetting"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  JWT_ISSUER_URI: "https://your-idp.example/realms/your-realm"
  # Alternative to JWT — also set APP_SECURITY_AUTH_TYPE in the Secret and remove JWT_ISSUER_URI:
  # APP_SECURITY_AUTH_TYPE: "api-key"
  # APP_SECURITY_API_KEY: "REPLACE_WITH_LONG_RANDOM_SECRET"
