sonar.projectKey=com.sportsbetting:sportsbetting-eventdriven
sonar.projectName=sportsbetting-eventdriven
sonar.sourceEncoding=UTF-8

# Monorepo coverage
sonar.sources=platform,services
sonar.tests=platform,services
sonar.java.binaries=**/target/classes

# Test and generated content filters
sonar.exclusions=**/target/**,**/build/**,**/out/**,**/*.md,**/Dockerfile*
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*IT.java,**/*IntegrationTest.java
