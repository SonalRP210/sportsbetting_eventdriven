global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'sportsbetting-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:18089'
          - 'api-gateway:8080'
          - 'user-service:8080'
          - 'wallet-service:8080'
          - 'betting-service:8084'
          - 'odds-service:8080'
          - 'event-ingestion-service:8080'
          - 'settlement-service:8080'
          - 'notification-service:8080'
          - 'risk-service:8080'
        labels:
          application: 'sportsbetting'
          environment: 'loadtest'

  - job_name: 'redpanda'
    metrics_path: '/public_metrics'
    static_configs:
      - targets: ['redpanda:9644']
        labels:
          application: 'redpanda'
          environment: 'loadtest'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
        labels:
          application: 'prometheus'
