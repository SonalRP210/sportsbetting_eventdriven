# Spring Boot Observability Configuration
# Include in each microservice's application.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        spring.cloud.gateway.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 300ms, 500ms, 1000ms, 2000ms, 5000ms
      percentiles:
        http.server.requests: 0.5, 0.75, 0.9, 0.95, 0.99
    enable:
      jvm: true
      process: true
      system: true
      hikaricp: true
      kafka: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3,w3c
  observations:
    key-values:
      environment: ${ENVIRONMENT:local}

# OpenTelemetry SDK Configuration
otel:
  exporter:
    otlp:
      endpoint: http://otel-collector:4317
      protocol: grpc
  resource:
    attributes:
      service.name: ${spring.application.name}
      service.namespace: sportsbetting
      deployment.environment: ${ENVIRONMENT:local}
  instrumentation:
    kafka:
      enabled: true
      producer-propagation: true
      consumer-propagation: true
    jdbc:
      enabled: true
    spring-web:
      enabled: true

# Kafka metrics
spring:
  kafka:
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

# Custom metrics registration
betting:
  metrics:
    enabled: true
    prefix: betting
