apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sportsbetting-services
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - sportsbetting
  selector:
    matchLabels:
      monitored: "true"
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app]
          targetLabel: service
        - sourceLabels: [__meta_kubernetes_pod_label_version]
          targetLabel: version
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: sportsbetting-pods
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - sportsbetting
  selector:
    matchLabels:
      monitored: "true"
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
