name: Release Gate

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to promote to"
        required: true
        type: choice
        options:
          - dev
          - stage
          - perf
          - prod
      image_tag:
        description: "Application image tag to deploy"
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify reactor
        run: mvn -B -q -DskipTests=false verify

      - name: Trigger DevOps release-gate workflow
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_PAT: ${{ secrets.CROSS_REPO_GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "CROSS_REPO_GH_PAT is required for cross-repo promotion."
            exit 1
          fi

          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            https://api.github.com/repos/SonalRP210/devops-platform/actions/workflows/release-gate.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"target_environment\":\"${{ inputs.target_environment }}\",\"image_tag\":\"${{ inputs.image_tag }}\"}}"

      - name: Trigger Observability release workflow
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_PAT: ${{ secrets.CROSS_REPO_GH_PAT }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            https://api.github.com/repos/SonalRP210/observability-platform/actions/workflows/release-observability.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"target_environment\":\"${{ inputs.target_environment }}\"}}"

      - name: Release summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Triggered promotions for:"
          echo "- environment: ${{ inputs.target_environment }}"
          echo "- image tag: ${{ inputs.image_tag }}"
