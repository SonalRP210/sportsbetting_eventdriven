name: Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests (kubectl client dry-run)
        run: bash scripts/ci/k8s-manifest-dry-run.sh

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test reactor
        run: mvn -B -q test

      - name: Start release stack
        run: docker compose -f infra/local/docker-compose.yml up --build -d

      - name: Wait for API gateway health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8070/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Gateway did not become healthy in time" >&2
          exit 1

      - name: Schema compatibility checks
        run: bash scripts/release/schema-compatibility-check.sh

      - name: Full E2E checks
        run: bash scripts/release/full-e2e.sh

      - name: Resilience checks
        run: bash scripts/release/resilience-check.sh

      - name: Dump compose status on failure
        if: failure()
        run: |
          docker compose -f infra/local/docker-compose.yml ps
          docker compose -f infra/local/docker-compose.yml logs --no-color --tail=200

      - name: Stop release stack
        if: always()
        run: docker compose -f infra/local/docker-compose.yml down -v
