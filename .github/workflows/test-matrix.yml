name: Test Matrix

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-and-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and slice tests
        run: mvn -B -q test

  integration:
    runs-on: ubuntu-latest
    needs: [unit-and-slice]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Integration tests (Testcontainers) + coverage merge + static analysis
        run: mvn -B -q -Pquality-tools verify
