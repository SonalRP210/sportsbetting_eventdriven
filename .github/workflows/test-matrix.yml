name: Test Matrix

on:
  pull_request:
  push:
    branches:
      - main
      - eventdriven

jobs:
  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests (kubectl client dry-run)
        run: bash scripts/ci/k8s-manifest-dry-run.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and slice tests
        run: mvn -B -q test

  integration:
    runs-on: ubuntu-latest
    needs: [unit, k8s-manifests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Integration tests (Testcontainers) + coverage merge + static analysis
        run: mvn -B -q -Pquality-tools verify

  e2e:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose -f infra/local/docker-compose.yml up --build -d
      - name: Wait for gateway
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8070/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: API E2E
        run: bash scripts/release/full-e2e.sh
      - name: Teardown
        if: always()
        run: docker compose -f infra/local/docker-compose.yml down -v

  non-functional:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP dependency check
        run: bash scripts/security/owasp-dependency-check.sh
