name: CI Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: "21"

jobs:
  package-artifacts:
    name: Package Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build release artifacts
        run: mvn -B -q -DskipTests package
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reactor-jars-${{ github.run_id }}
          path: |
            **/target/*.jar
            !**/target/*-sources.jar
            !**/target/*-javadoc.jar
          if-no-files-found: error

  docker-build-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [package-artifacts]
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - services/api-gateway/Dockerfile
          - services/user-service/Dockerfile
          - services/betting-service/Dockerfile
          - services/wallet-service/Dockerfile
          - services/odds-service/Dockerfile
          - services/event-ingestion-service/Dockerfile
          - services/settlement-service/Dockerfile
          - services/notification-service/Dockerfile
          - services/risk-service/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          provenance: false
